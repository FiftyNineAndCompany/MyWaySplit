name: Daily Push Notification
on:
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch: 

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OneSignal API
        run: |
          curl -i --request POST \
            --url https://api.onesignal.com/notifications \
            --header 'Authorization: Key ${{ secrets.ONESIGNAL_REST_KEY }}' \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data '{
              "app_id": "233e26d3-7870-419f-981b-e1de2b055308",
              "included_segments": ["Total Subscriptions"],
              "headings": {"en": "FairShare Daily Reminder 💰"},
              "contents": {"en": "Time to check your pending settlements and pay your debts!"}
            }'
