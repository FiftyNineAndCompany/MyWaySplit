<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairShare - Advanced Expense Splitter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom scrollbar for aesthetic */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

<div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Top Bar -->
    <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-4xl font-extrabold text-indigo-600 flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                FairShare
            </h1>
            <p class="text-slate-500 mt-1 text-sm font-medium">Split expenses. Settle up seamlessly.</p>
        </div>

        <button id="reminder-btn" onclick="setupBackendReminders()" 
                class="flex items-center gap-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-full font-medium transition shadow-sm text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span id="reminder-text">Enable Auto-Reminders</span>
        </button>
    </header>

    <!-- Global Toast Notification Area -->
    <div id="toast-area" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80"></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- LEFT COLUMN: Inputs (Add Users & Expenses) -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- 1. Add Participant Form -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center gap-2">
                    <span class="bg-indigo-100 text-indigo-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">1</span>
                    Add Participants
                </h2>
                <div class="space-y-3">
                    <input type="text" id="part-name" placeholder="Name (e.g., Rahul)" 
                           class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm">
                    <div class="flex gap-2">
                        <input type="text" id="part-upi" placeholder="UPI ID (e.g., rahul@okhdfc)" 
                               class="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm">
                        <button onclick="addParticipant()" 
                                class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold transition shadow-sm">
                            Add
                        </button>
                    </div>
                </div>
                
                <!-- Participant Chips -->
                <div class="mt-4 pt-4 border-t border-slate-100 min-h-[50px]">
                    <ul id="participants-list" class="flex flex-wrap gap-2 text-sm">
                        <li class="text-slate-400 italic text-sm" id="empty-part-msg">No participants added.</li>
                    </ul>
                </div>
            </div>

            <!-- 2. Add/Edit Expense Form -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 relative">
                <!-- Overlay when no participants exist -->
                <div id="expense-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-[1px] z-10 flex items-center justify-center rounded-2xl">
                    <p class="text-slate-500 font-medium bg-white px-4 py-2 rounded-full shadow-sm border border-slate-100">Add participants first</p>
                </div>

                <h2 class="text-lg font-bold mb-4 text-slate-800 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="bg-emerald-100 text-emerald-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">2</span>
                        <span id="expense-form-title">Record Expense</span>
                    </div>
                    <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden text-xs text-slate-500 hover:text-slate-700 font-medium">Cancel Edit</button>
                </h2>
                
                <div class="space-y-4">
                    <input type="text" id="exp-desc" placeholder="What was it for? (e.g., Dinner)" 
                           class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    
                    <div class="flex gap-3">
                        <div class="flex-1 relative">
                            <span class="absolute left-3 top-2.5 text-slate-500">₹</span>
                            <input type="number" id="exp-amount" placeholder="0.00" min="0" step="1"
                                   class="w-full border border-slate-300 rounded-xl pl-7 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        </div>
                        <select id="exp-payer" class="flex-1 border border-slate-300 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white">
                            <option value="">Who paid?</option>
                        </select>
                    </div>

                    <!-- Split among checkboxes -->
                    <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Split Among</label>
                        <div id="split-checkboxes" class="grid grid-cols-2 gap-2 max-h-32 overflow-y-auto">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <button id="save-expense-btn" onclick="saveExpense()" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-semibold transition shadow-sm mt-2">
                        Save Expense
                    </button>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Dashboard Stats -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col">
                    <span class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-1">Total Spent</span>
                    <span class="text-3xl font-extrabold text-slate-800" id="total-spent">₹0</span>
                </div>
                <div class="bg-indigo-600 rounded-2xl p-5 border border-indigo-700 shadow-sm flex flex-col text-white">
                    <span class="text-indigo-200 text-xs font-bold uppercase tracking-wider mb-1">Active Group</span>
                    <span class="text-3xl font-extrabold" id="total-people">0</span>
                </div>
            </div>

            <!-- Settlement Plan (The Math output) -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold mb-4 text-slate-800 flex justify-between items-center border-b border-slate-100 pb-3">
                    <div class="flex items-center gap-2">
                        <span class="bg-amber-100 text-amber-700 w-6 h-6 rounded-full flex items-center justify-center text-sm">3</span>
                        Settlement Plan
                    </div>
                </h2>
                
                <div id="settlements-list" class="space-y-3">
                    <div class="text-center py-8 text-slate-400 text-sm italic border-2 border-dashed border-slate-100 rounded-xl">
                        Add expenses to see who owes whom.
                    </div>
                </div>
            </div>

            <!-- Recent Expenses List -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-bold mb-4 text-slate-800 border-b border-slate-100 pb-3">Recent Transactions</h2>
                <div class="overflow-hidden">
                    <ul id="expenses-list" class="divide-y divide-slate-100 max-h-[250px] overflow-y-auto pr-2">
                        <li class="py-6 text-center text-slate-400 text-sm italic" id="empty-exp-msg">
                            No transactions yet.
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    let participants = []; 
    // Format: { id: string, name: string, upi: string }
    
    let expenses = [];     
    // Format: { id: string, desc: string, amount: number, payerId: string, involvedIds: array, date: string }

    let editingExpenseId = null;

    // --- DOM ELEMENTS ---
    const DOM = {
        toastArea: document.getElementById('toast-area'),
        partName: document.getElementById('part-name'),
        partUpi: document.getElementById('part-upi'),
        partList: document.getElementById('participants-list'),
        emptyPartMsg: document.getElementById('empty-part-msg'),
        
        expenseOverlay: document.getElementById('expense-overlay'),
        expFormTitle: document.getElementById('expense-form-title'),
        cancelEditBtn: document.getElementById('cancel-edit-btn'),
        expDesc: document.getElementById('exp-desc'),
        expAmount: document.getElementById('exp-amount'),
        expPayer: document.getElementById('exp-payer'),
        splitCheckboxes: document.getElementById('split-checkboxes'),
        saveExpBtn: document.getElementById('save-expense-btn'),
        
        totalSpent: document.getElementById('total-spent'),
        totalPeople: document.getElementById('total-people'),
        expensesList: document.getElementById('expenses-list'),
        emptyExpMsg: document.getElementById('empty-exp-msg'),
        settlementsList: document.getElementById('settlements-list')
    };

    // --- TOAST NOTIFICATIONS ---
    function showToast(message, type = 'success') {
        const id = Date.now();
        const colors = {
            success: 'bg-emerald-600',
            error: 'bg-red-500',
            info: 'bg-blue-600'
        };
        const icon = type === 'success' ? '✓' : type === 'error' ? '!' : 'i';
        
        const toast = document.createElement('div');
        toast.id = `toast-${id}`;
        toast.className = `${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 fade-in transform transition-all duration-300 translate-x-full`;
        
        toast.innerHTML = `
            <div class="bg-white/20 rounded-full w-6 h-6 flex items-center justify-center font-bold text-sm">${icon}</div>
            <p class="text-sm font-medium">${message}</p>
        `;
        
        DOM.toastArea.appendChild(toast);
        
        // Slide in
        setTimeout(() => toast.classList.remove('translate-x-full'), 10);
        
        // Remove after 3.5s
        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-x-full');
            setTimeout(() => toast.remove(), 300);
        }, 3500);
    }

    // --- GENERATE UNIQUE ID ---
    function generateId() {
        return Math.random().toString(36).substring(2, 9);
    }

    // --- ADD PARTICIPANT ---
    function addParticipant() {
        const name = DOM.partName.value.trim();
        const upi = DOM.partUpi.value.trim();

        if (!name) return showToast('Please enter a name.', 'error');
        if (participants.some(p => p.name.toLowerCase() === name.toLowerCase())) {
            return showToast(`${name} is already added.`, 'error');
        }

        const newPart = { id: generateId(), name: name, upi: upi };
        participants.push(newPart);
        
        DOM.partName.value = '';
        DOM.partUpi.value = '';
        
        updateUI();
        showToast(`Added ${name}`, 'success');
    }

    function updateParticipantsUI() {
        DOM.totalPeople.textContent = participants.length;
        
        if (participants.length > 0) {
            DOM.emptyPartMsg.style.display = 'none';
            DOM.expenseOverlay.style.display = 'none'; // Unlock expense form
        } else {
            DOM.emptyPartMsg.style.display = 'block';
            DOM.expenseOverlay.style.display = 'flex';
        }

        // Render chips
        DOM.partList.innerHTML = participants.map(p => `
            <li class="bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 shadow-sm fade-in">
                ${p.name}
                ${p.upi ? `<span class="bg-green-100 text-green-700 px-1.5 py-0.5 rounded text-[10px] font-bold">UPI</span>` : ''}
            </li>
        `).join('');

        // Update Payer Dropdown (preserve selection if possible)
        const currentPayerId = DOM.expPayer.value;
        DOM.expPayer.innerHTML = '<option value="">Select Payer...</option>' + 
            participants.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        if (currentPayerId && participants.find(p => p.id === currentPayerId)) {
            DOM.expPayer.value = currentPayerId;
        }

        // Update Split Checkboxes
        // Only update if not currently editing to prevent overwriting edit state
        if (!editingExpenseId) {
            DOM.splitCheckboxes.innerHTML = participants.map(p => `
                <label class="flex items-center gap-2 cursor-pointer bg-white border border-slate-200 p-2 rounded-lg hover:bg-slate-50 transition">
                    <input type="checkbox" value="${p.id}" checked class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
                    <span class="text-sm font-medium text-slate-700 truncate">${p.name}</span>
                </label>
            `).join('');
        }
    }

    // --- ADD/EDIT EXPENSE ---
    function saveExpense() {
        const desc = DOM.expDesc.value.trim() || 'Misc Expense';
        const amount = parseFloat(DOM.expAmount.value);
        const payerId = DOM.expPayer.value;
        
        // Get checked participant IDs
        const checkboxes = DOM.splitCheckboxes.querySelectorAll('input[type="checkbox"]:checked');
        const involvedIds = Array.from(checkboxes).map(cb => cb.value);

        // Validation
        if (isNaN(amount) || amount <= 0) return showToast('Enter a valid amount > 0.', 'error');
        if (!payerId) return showToast('Select who paid.', 'error');
        if (involvedIds.length === 0) return showToast('Select at least one person to split with.', 'error');

        if (editingExpenseId) {
            // Edit existing
            const expIndex = expenses.findIndex(e => e.id === editingExpenseId);
            if (expIndex !== -1) {
                expenses[expIndex] = { ...expenses[expIndex], desc, amount, payerId, involvedIds };
                showToast('Expense updated.', 'success');
            }
            cancelEdit();
        } else {
            // Add new
            expenses.push({
                id: generateId(), desc, amount, payerId, involvedIds, 
                date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
            });
            showToast('Expense added.', 'success');
        }

        // Reset inputs
        DOM.expDesc.value = '';
        DOM.expAmount.value = '';
        DOM.expPayer.value = '';
        // Reset checkboxes to all checked
        DOM.splitCheckboxes.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
        
        updateUI();
    }

    function editExpense(id) {
        const exp = expenses.find(e => e.id === id);
        if (!exp) return;

        editingExpenseId = id;
        DOM.expFormTitle.textContent = 'Edit Expense';
        DOM.saveExpBtn.textContent = 'Update Expense';
        DOM.saveExpBtn.classList.replace('bg-emerald-600', 'bg-amber-500');
        DOM.saveExpBtn.classList.replace('hover:bg-emerald-700', 'hover:bg-amber-600');
        DOM.cancelEditBtn.classList.remove('hidden');

        DOM.expDesc.value = exp.desc;
        DOM.expAmount.value = exp.amount;
        DOM.expPayer.value = exp.payerId;

        // Populate checkboxes based on involvedIds
        DOM.splitCheckboxes.innerHTML = participants.map(p => {
            const isChecked = exp.involvedIds.includes(p.id) ? 'checked' : '';
            return `
            <label class="flex items-center gap-2 cursor-pointer bg-white border border-slate-200 p-2 rounded-lg hover:bg-slate-50 transition">
                <input type="checkbox" value="${p.id}" ${isChecked} class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
                <span class="text-sm font-medium text-slate-700 truncate">${p.name}</span>
            </label>`;
        }).join('');
        
        // Scroll to form
        DOM.expDesc.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function cancelEdit() {
        editingExpenseId = null;
        DOM.expFormTitle.textContent = 'Record Expense';
        DOM.saveExpBtn.textContent = 'Save Expense';
        DOM.saveExpBtn.classList.replace('bg-amber-500', 'bg-emerald-600');
        DOM.saveExpBtn.classList.replace('hover:bg-amber-600', 'hover:bg-emerald-700');
        DOM.cancelEditBtn.classList.add('hidden');
        
        DOM.expDesc.value = '';
        DOM.expAmount.value = '';
        DOM.expPayer.value = '';
        updateParticipantsUI(); // Resets checkboxes to all checked
    }

    function deleteExpense(id) {
        expenses = expenses.filter(e => e.id !== id);
        if (editingExpenseId === id) cancelEdit();
        updateUI();
        showToast('Expense deleted.', 'info');
    }

    function updateExpensesListUI() {
        DOM.emptyExpMsg.style.display = expenses.length > 0 ? 'none' : 'block';
        
        let total = 0;
        
        // Sort newest first
        const sorted = [...expenses].reverse();
        
        DOM.expensesList.innerHTML = sorted.map(exp => {
            total += exp.amount;
            const payerName = participants.find(p => p.id === exp.payerId)?.name || 'Unknown';
            const involvedCount = exp.involvedIds.length;
            
            return `
            <li class="py-4 flex justify-between items-center group border-b border-slate-50 last:border-0 fade-in">
                <div class="flex flex-col">
                    <span class="font-bold text-slate-800">${exp.desc}</span>
                    <span class="text-xs text-slate-500 mt-0.5">
                        <span class="font-semibold text-slate-700">${payerName}</span> paid for ${involvedCount} ${involvedCount === 1 ? 'person' : 'people'} • ${exp.date}
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    <span class="font-extrabold text-slate-800">₹${exp.amount.toFixed(2)}</span>
                    <div class="flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editExpense('${exp.id}')" class="text-[10px] uppercase font-bold text-indigo-600 hover:text-indigo-800">Edit</button>
                        <button onclick="deleteExpense('${exp.id}')" class="text-[10px] uppercase font-bold text-red-500 hover:text-red-700">Del</button>
                    </div>
                </div>
            </li>
            `;
        }).join('');
        
        DOM.totalSpent.textContent = `₹${total.toFixed(0)}`;
    }

    // --- SETTLEMENT MATH ALGORITHM ---
    function updateSettlementsUI() {
        if (expenses.length === 0) {
            DOM.settlementsList.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm italic border-2 border-dashed border-slate-100 rounded-xl">Add expenses to see who owes whom.</div>`;
            return;
        }

        // 1. Calculate Balances
        const balances = {};
        participants.forEach(p => balances[p.id] = 0);

        expenses.forEach(exp => {
            const splitAmount = exp.amount / exp.involvedIds.length;
            
            // Deduct split amount from everyone involved
            exp.involvedIds.forEach(id => {
                if (balances[id] !== undefined) balances[id] -= splitAmount;
            });
            
            // Add full amount to payer
            if (balances[exp.payerId] !== undefined) {
                balances[exp.payerId] += exp.amount;
            }
        });

        // 2. Separate into Debtors and Creditors
        let debtors = [];
        let creditors = [];

        participants.forEach(p => {
            const roundedBalance = Math.round(balances[p.id] * 100) / 100;
            if (roundedBalance < 0) debtors.push({ ...p, amount: Math.abs(roundedBalance) });
            else if (roundedBalance > 0) creditors.push({ ...p, amount: roundedBalance });
        });

        // 3. Match them up (Greedy approach)
        debtors.sort((a, b) => b.amount - a.amount);
        creditors.sort((a, b) => b.amount - a.amount);

        const settlements = [];
        let i = 0, j = 0;

        while (i < debtors.length && j < creditors.length) {
            let debtor = debtors[i];
            let creditor = creditors[j];
            
            let amount = Math.min(debtor.amount, creditor.amount);
            
            if (amount > 0.05) { // Avoid float dust
                settlements.push({
                    debtor: debtor,
                    creditor: creditor,
                    amount: amount
                });
            }

            debtor.amount -= amount;
            creditor.amount -= amount;

            if (debtor.amount < 0.05) i++;
            if (creditor.amount < 0.05) j++;
        }

        // 4. Render output with UPI links
        if (settlements.length === 0) {
            DOM.settlementsList.innerHTML = `<div class="bg-emerald-50 text-emerald-700 p-4 rounded-xl text-center font-bold border border-emerald-100 flex items-center justify-center gap-2"><span>🎉</span> All settled up!</div>`;
            return;
        }

        DOM.settlementsList.innerHTML = settlements.map(s => {
            // Generate UPI Link if creditor has a UPI ID
            let upiButton = '';
            if (s.creditor.upi) {
                // Format: upi://pay?pa=UPI_ID&pn=NAME&am=AMOUNT&cu=INR
                const upiLink = `upi://pay?pa=${encodeURIComponent(s.creditor.upi)}&pn=${encodeURIComponent(s.creditor.name)}&am=${s.amount.toFixed(2)}&cu=INR`;
                upiButton = `
                    <a href="${upiLink}" class="mt-3 flex items-center justify-center gap-1 w-full bg-slate-800 hover:bg-slate-900 text-white py-2 rounded-lg text-xs font-semibold transition shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                        Pay ₹${s.amount.toFixed(2)} via UPI
                    </a>
                `;
            }

            return `
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 fade-in flex flex-col">
                <div class="flex items-center justify-between mb-1">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-red-600">${s.debtor.name}</span>
                        <span class="text-slate-400 text-xs">owes</span>
                        <span class="font-bold text-emerald-600">${s.creditor.name}</span>
                    </div>
                    <span class="font-extrabold text-slate-800 bg-white border border-slate-200 px-2 py-1 rounded shadow-sm text-sm">₹${s.amount.toFixed(2)}</span>
                </div>
                ${upiButton}
            </div>
            `;
        }).join('');
    }

    // Master update function
    function updateUI() {
        updateParticipantsUI();
        updateExpensesListUI();
        updateSettlementsUI();
    }

    // --- BACKEND NOTIFICATION SIMULATION ---
    async function setupBackendReminders() {
        const btn = document.getElementById('reminder-btn');
        const text = document.getElementById('reminder-text');
        
        // 1. Request Native Notification Permission
        try {
            const permission = await Notification.requestPermission();
            
            if (permission !== 'granted') {
                showToast('Notification permission denied by user.', 'error');
                return;
            }

            // 2. Simulate fetching FCM/APNs Device Token
            text.textContent = 'Generating Token...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            showToast('Contacting Push servers...', 'info');

            setTimeout(() => {
                const mockDeviceToken = "device_token_" + Math.random().toString(36).substring(2, 15);
                console.log("Obtained Push Token:", mockDeviceToken);
                
                // 3. Simulate API Call saving token to backend database
                text.textContent = 'Saving to Server...';
                
                setTimeout(() => {
                    // Simulated POST request payload
                    const payload = {
                        userId: "current_user_123",
                        pushToken: mockDeviceToken,
                        scheduleTime: ["10:00", "16:00"],
                        os: "web"
                    };
                    console.log("POST /api/notifications/subscribe", payload);

                    // 4. Success State
                    btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-200', 'hover:bg-slate-50', 'opacity-75', 'cursor-not-allowed');
                    btn.classList.add('bg-green-100', 'text-green-800', 'border-green-200');
                    text.textContent = 'Auto-Reminders Active';
                    btn.onclick = null; // Disable button after activation
                    
                    showToast('Backend configured! Server will ping debts at 10AM & 4PM.', 'success');
                    
                    // Show a local test notification right now just to prove it works
                    new Notification("FairShare Setup Complete", {
                        body: "Your device is registered. We'll handle the awkward reminders for you!",
                        icon: "https://placehold.co/100x100/4f46e5/ffffff?text=FS" // Mock icon
                    });

                }, 1500); // 1.5s simulated network delay
            }, 1000); // 1s simulated token generation delay

        } catch (error) {
            console.error("Notification Error:", error);
            showToast('Failed to setup notifications. Ensure you are on HTTPS.', 'error');
        }
    }

    // Initialize UI on load
    updateUI();

</script>
</body>
</html>
